# /etc/nodogsplash/nodogsplash.conf
# Copy this file to your OpenWrt router at /etc/nodogsplash/nodogsplash.conf

GatewayInterface wlan0          # your WiFi interface (run: ip link)
GatewayAddress 192.168.1.1      # your router's IP
GatewayPort 2050                # nodogsplash auth port (keep as 2050)

# Point to your cloud server portal URL
FAS https://cephas-captive-portal.fly.dev/

SessionTimeout 3600

FirewallRuleSet preauthenticated-users {
  FirewallRule allow tcp port 53
  FirewallRule allow udp port 53
  FirewallRule allow udp port 67
}
