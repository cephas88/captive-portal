# /etc/nodogsplash/nodogsplash.conf
# Place this file on your OpenWrt router.

GatewayInterface wlan0         # your WiFi interface (check: ip link)
GatewayAddress 192.168.1.1     # router's IP on the WiFi subnet
GatewayPort 2050               # nodogsplash auth port

# FAS = Forwarding Authentication Service
# nodogsplash will redirect clients to this URL and append:
#   ?clientip=X&clientmac=Y&tok=Z&redir=ORIGINAL_URL
FAS http://192.168.1.1:5000/   # Change to your portal server IP/port

# How long (seconds) an authenticated session lasts by default
# (overridden per-session by the portal when granting access)
SessionTimeout 3600

# Bandwidth limits (optional — remove if not needed)
# DownloadLimit 10240   # 10 Mbps in kbps
# UploadLimit 2048

# Allow DNS and DHCP through before authentication
FirewallRuleSet preauthenticated-users {
  FirewallRule allow tcp port 53
  FirewallRule allow udp port 53
  FirewallRule allow udp port 67
}

# Allow access to the portal server itself (so the page loads before auth)
FirewallRuleSet preauthenticated-users {
  FirewallRule allow tcp port 5000
}
