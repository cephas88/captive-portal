# Fly.io deployment config
app = "cephas-captive-portal"
primary_region = "jnb"

[build]

[env]
  PORT = "8080"
  PORTAL_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "portal_data"
  destination = "/data"
